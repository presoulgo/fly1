name: Fly.io Scheduled Restart

on:
  schedule:
    # 每天北京时间 03:00（UTC 19:00）
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: flyio-scheduled-restart
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_NAME: root-dry-headland-5347
      FLY_MACHINE_ID: 0803406c116708

    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restart Fly Machine
        shell: bash
        run: |
          # GitHub Secret must be a single-line Fly token.
          # Remove accidental CR/LF characters without printing the token.
          TOKEN="$(printf '%s' "$FLY_API_TOKEN" | tr -d '\r\n')"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::FLY_API_TOKEN is empty. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          FLY_API_TOKEN="$TOKEN" flyctl machine restart "$FLY_MACHINE_ID" \
            --app "$FLY_APP_NAME"
